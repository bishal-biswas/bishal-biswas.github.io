name: Deploy to GitHub Pages

on:
  # Rebuild so posts with a future publishDate go live on their day.
  # publishDate is date-only, so it parses as 00:00 UTC (05:30 IST); the
  # 00:17 UTC run is the first one after a post comes due.
  # GitHub's scheduler is best-effort: runs are often late and can be dropped
  # outright under load, worst at :00 and :30. Hence the odd minute, and the
  # three later runs as backups (05:47, 11:47, 17:47, 23:47 IST).
  schedule:
    - cron: "17 0,6,12,18 * * *"
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
# Collapse rapid CMS commits (one per media upload) into a single deploy.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)
          # build-cmd: pnpm run build # The command to run to build your site. Runs the package build script/task by default. (optional)
        # PUBLIC_* values end up in the built JS, so they are repository
        # variables (Settings > Secrets and variables > Actions > Variables),
        # not secrets. An unset one is an empty string, which every form
        # already degrades gracefully around. See .env.example.
        env:
          PUBLIC_SHEETS_ENDPOINT: ${{ vars.PUBLIC_SHEETS_ENDPOINT }}
          PUBLIC_API_TOKEN: ${{ vars.PUBLIC_API_TOKEN }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.PUBLIC_EMAILJS_PUBLIC_KEY }}
          PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_AUTOREPLY_TEMPLATE_ID: ${{ vars.PUBLIC_EMAILJS_AUTOREPLY_TEMPLATE_ID }}
          PUBLIC_LIVE_TESTIMONIALS: ${{ vars.PUBLIC_LIVE_TESTIMONIALS }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
